<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀ナイン 空卓ステータス(サイズ編集用)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0c0c10; --panel:#17171d; --panel-2:#1e1e26; --border:#2b2b34;
    --text:#f2ede1; --text-dim:#9d968a;
    --gold:#cdaf6d; --gold-soft:rgba(205,175,109,.14);
    --green:#3fb673; --green-soft:rgba(63,182,115,.14);
    --red:#e0574f; --red-soft:rgba(224,87,79,.14);
    --scale:1;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;margin:0;
    -webkit-tap-highlight-color:transparent;}
  h1,h2{margin:0;text-wrap:balance;}
  p{margin:0;}
  .wrap{max-width:460px;margin:0 auto;padding:28px 20px 56px;}

  .eyebrow{text-align:center;font-family:'Work Sans',sans-serif;font-size:11px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);margin-bottom:18px;}

  /* ---------- the card (screenshot target) ---------- */
  #card{background:var(--panel);border:1px solid var(--border);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6);}
  .card-head{padding:calc(22px * var(--scale)) calc(22px * var(--scale)) calc(18px * var(--scale));
    border-bottom:1px solid var(--border);}
  .head-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;}
  .venue{font-family:'Bebas Neue',sans-serif;font-size:calc(34px * var(--scale));letter-spacing:.03em;
    color:var(--text);white-space:nowrap;}
  .clock-block{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;}
  .clock-lbl{font-family:'Work Sans',sans-serif;font-size:9px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-dim);}
  .flip-clock{display:flex;align-items:center;gap:3px;}
  .flip-unit{position:relative;min-width:calc(24px * var(--scale));background:#101014;color:var(--text);
    font-family:'Bebas Neue',sans-serif;font-size:calc(28px * var(--scale));line-height:1;text-align:center;
    padding:calc(7px * var(--scale)) calc(3px * var(--scale)) calc(6px * var(--scale));border-radius:4px;border:1px solid #050506;
    box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
    font-variant-numeric:tabular-nums;overflow:hidden;}
  .flip-unit::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;
    background:rgba(0,0,0,.6);transform:translateY(-.5px);}
  .flip-colon{font-family:'Bebas Neue',sans-serif;font-size:calc(22px * var(--scale));color:var(--text-dim);padding:0 1px;}
  .subline{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:calc(20px * var(--scale));
    letter-spacing:.02em;color:var(--gold);margin-top:10px;}
  .stats{display:flex;gap:10px;margin-top:14px;}
  .stat{position:relative;flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;
    padding:calc(16px * var(--scale)) calc(6px * var(--scale)) calc(10px * var(--scale));text-align:center;}
  .stat .lbl{position:absolute;top:calc(8px * var(--scale));left:calc(9px * var(--scale));
    font-family:'Work Sans',sans-serif;font-size:calc(9px * var(--scale));
    color:var(--text-dim);letter-spacing:.02em;}
  .stat .num{font-family:'Bebas Neue',sans-serif;font-size:calc(26px * var(--scale));line-height:1;
    font-variant-numeric:tabular-nums;margin-top:calc(10px * var(--scale));}
  .stat.free .num{color:var(--gold);}
  .stat.rental .num{color:var(--red);}
  .stat.open .num{color:var(--green);}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:calc(10px * var(--scale));padding:calc(20px * var(--scale));}
  .table-cell{position:relative;aspect-ratio:1/.8;border-radius:14px;border:1.5px solid transparent;
    display:flex;align-items:center;justify-content:center;padding:calc(10px * var(--scale));
    cursor:pointer;user-select:none;transition:transform .12s ease;}
  .table-cell:active{transform:scale(.96);}
  .table-cell .tno{position:absolute;top:calc(9px * var(--scale));left:calc(11px * var(--scale));
    font-family:'Bebas Neue',sans-serif;font-size:calc(13px * var(--scale));letter-spacing:.02em;color:var(--text-dim);}
  .table-cell .state{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:calc(19px * var(--scale));}
  .table-cell.is-open{background:var(--green-soft);border-color:var(--green);}
  .table-cell.is-open .state{color:var(--green);}
  .table-cell.is-free,.table-cell.is-rental{background:var(--red-soft);border-color:var(--red);}
  .table-cell.is-free .state,.table-cell.is-rental .state{color:var(--red);}

  .legend{display:flex;justify-content:center;gap:16px;padding:0 20px 20px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:6px;font-family:'Work Sans',sans-serif;font-size:11px;color:var(--text-dim);}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .legend .i-open{background:var(--green);} .legend .i-free{background:var(--red);}

  .hint{text-align:center;font-family:'Work Sans',sans-serif;font-size:11px;color:var(--text-dim);
    margin-top:14px;line-height:1.6;}

  /* ---------- controls (outside the screenshot area) ---------- */
  .controls{margin-top:28px;padding-top:22px;border-top:1px solid var(--border);}
  .control-row{display:flex;align-items:center;gap:12px;}
  .control-row label{font-family:'Work Sans',sans-serif;font-size:11.5px;color:var(--text-dim);flex:none;width:88px;}
  input[type="range"]{flex:1;accent-color:var(--gold);}
  .save-btn{margin-top:16px;width:100%;padding:13px;border-radius:10px;border:1px solid var(--gold);
    background:var(--gold-soft);color:var(--gold);font-family:'Work Sans',sans-serif;font-size:13px;
    font-weight:700;letter-spacing:.02em;cursor:pointer;}
  .save-btn:hover{background:var(--gold);color:#171008;}
  .save-btn:disabled{opacity:.5;cursor:default;}
  .reset-btn{margin-top:10px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel);color:var(--text-dim);font-family:'Work Sans',sans-serif;font-size:12.5px;
    font-weight:600;cursor:pointer;}
  .reset-btn:hover{color:var(--text);border-color:var(--gold);}
  .save-status{margin-top:8px;min-height:14px;font-family:'Work Sans',sans-serif;font-size:10.5px;
    color:var(--text-dim);text-align:center;}
  .controls-note{margin-top:10px;font-family:'Work Sans',sans-serif;font-size:10.5px;color:var(--text-dim);
    text-align:center;line-height:1.6;}

  @media (prefers-reduced-motion:reduce){
    .table-cell{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Screenshot this card for your Story</p>

  <div id="card">
    <div class="card-head">
      <div class="head-top">
        <h1 class="venue">麻雀ナイン</h1>
        <div class="clock-block">
          <p class="clock-lbl">Updated</p>
          <div class="flip-clock">
            <span class="flip-unit" id="flipH1">0</span>
            <span class="flip-unit" id="flipH2">0</span>
            <span class="flip-colon">:</span>
            <span class="flip-unit" id="flipM1">0</span>
            <span class="flip-unit" id="flipM2">0</span>
          </div>
        </div>
      </div>
      <p class="subline">【 現在の卓状況 】</p>
      <div class="stats">
        <div class="stat free"><p class="lbl">フリー稼働</p><p class="num" id="statFree">0</p></div>
        <div class="stat rental"><p class="lbl">貸卓使用中</p><p class="num" id="statRental">0</p></div>
        <div class="stat open"><p class="lbl">空卓</p><p class="num" id="statOpen">0</p></div>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="legend">
      <span><i class="i-open"></i>空卓</span>
      <span><i class="i-free"></i>稼働中(フリー/貸卓はマス内の表記で区別)</span>
    </div>
  </div>

  <p class="hint">卓をタップすると状態が切り替わります(空卓 → フリー → 貸卓 → 空卓)。集計と更新時刻は自動で反映されます。下の「画像として保存」でカード部分だけを画像として保存できます。</p>

  <div class="controls">
    <div class="control-row">
      <label for="scaleSlider">卓の大きさ</label>
      <input type="range" id="scaleSlider" min="80" max="130" value="100">
    </div>
    <button class="save-btn" id="saveBtn">画像として保存</button>
    <p class="save-status" id="saveStatus"></p>
    <button class="reset-btn" id="resetBtn">全卓を空卓にリセット</button>
    <p class="controls-note">この操作パネルは画面に映しても問題ありませんが、ストーリーズには上のカード部分だけを切り取ってスクリーンショットしてください。</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  var LABELS = {open:'空卓', free:'フリー', rental:'貸卓使用中'};
  // 卓ごとの名称・許容する状態(フリー専用卓は貸卓に切り替わらない)・初期状態
  var TABLES = [
    {name:'フリー卓', states:['open','free'],          initial:'free'},
    {name:'自動配牌', states:['open','free','rental'], initial:'open'},
    {name:'通常卓',   states:['open','free','rental'], initial:'free'},
    {name:'通常卓',   states:['open','free','rental'], initial:'rental'},
    {name:'通常卓',   states:['open','free','rental'], initial:'open'},
    {name:'通常卓',   states:['open','free','rental'], initial:'open'}
  ];

  var grid = document.getElementById('grid');
  var cells = [];

  TABLES.forEach(function(t, i){
    var cell = document.createElement('div');
    cell.className = 'table-cell';
    cell.dataset.state = t.initial;
    cell.dataset.states = t.states.join(',');
    cell.innerHTML = '<span class="tno">' + t.name + '</span><span class="state"></span>';
    cell.addEventListener('click', (function(idx){
      return function(){
        var c = cells[idx];
        var states = c.dataset.states.split(',');
        var next = states[(states.indexOf(c.dataset.state) + 1) % states.length];
        c.dataset.state = next;
        render();
      };
    })(i));
    grid.appendChild(cell);
    cells.push(cell);
  });

  function render(){
    var free = 0, rental = 0, open = 0;
    cells.forEach(function(c){
      var s = c.dataset.state;
      c.classList.remove('is-open','is-free','is-rental');
      c.classList.add('is-' + s);
      c.querySelector('.state').textContent = LABELS[s];
      if (s === 'open') open++;
      if (s === 'free') free++;
      if (s === 'rental') rental++;
    });
    document.getElementById('statFree').textContent = free;
    document.getElementById('statRental').textContent = rental;
    document.getElementById('statOpen').textContent = open;
  }

  function tick(){
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    document.getElementById('flipH1').textContent = hh[0];
    document.getElementById('flipH2').textContent = hh[1];
    document.getElementById('flipM1').textContent = mm[0];
    document.getElementById('flipM2').textContent = mm[1];
  }

  document.getElementById('resetBtn').addEventListener('click', function(){
    cells.forEach(function(c){ c.dataset.state = 'open'; });
    render();
  });

  // ---- 画像として保存(通常のブラウザダウンロード。ログイン不要) ----
  var saveBtn = document.getElementById('saveBtn');
  var saveStatus = document.getElementById('saveStatus');

  saveBtn.addEventListener('click', function(){
    if (typeof html2canvas !== 'function') {
      saveStatus.textContent = '保存機能の読み込みに失敗しました。スクリーンショットをご利用ください。';
      return;
    }
    saveBtn.disabled = true;
    saveStatus.textContent = '画像を作成中...';
    html2canvas(document.getElementById('card'), {backgroundColor: null, scale: 2}).then(function(canvas){
      return new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
    }).then(function(blob){
      var d = new Date();
      var hh = String(d.getHours()).padStart(2, '0');
      var mm = String(d.getMinutes()).padStart(2, '0');
      var filename = '麻雀ナイン_卓状況_' + hh + mm + '.png';
      var file = new File([blob], filename, {type: 'image/png'});

      // iOS Safari等: 共有シート経由なら「写真に保存」が選べる
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        return navigator.share({files: [file]}).then(function(){
          saveStatus.textContent = '共有シートから「写真に保存」を選んでください';
        });
      }

      // 共有シート非対応環境: 新しいタブで画像を開き、長押しで保存してもらう
      var url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      saveStatus.textContent = '開いた画像を長押しして保存してください';
      setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
    }).catch(function(err){
      if (err && err.name === 'AbortError') { saveStatus.textContent = ''; return; }
      saveStatus.textContent = '保存できませんでした。スクリーンショットをご利用ください。';
    }).finally(function(){
      saveBtn.disabled = false;
    });
  });

  var scaleSlider = document.getElementById('scaleSlider');
  scaleSlider.addEventListener('input', function(){
    document.documentElement.style.setProperty('--scale', (scaleSlider.value / 100));
  });

  render();
  tick();
  setInterval(tick, 30000);
})();
</script>

</body>
</html>
