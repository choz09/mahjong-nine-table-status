<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀ナイン 空卓ステータス(サイズ編集用)</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0c0c10; --panel:#17171d; --panel-2:#1e1e26; --border:#2b2b34;
    --text:#f2ede1; --text-dim:#9d968a;
    --gold:#cdaf6d; --gold-soft:rgba(205,175,109,.14);
    --green:#3fb673; --green-soft:rgba(63,182,115,.14);
    --red:#e0574f; --red-soft:rgba(224,87,79,.14);
    /* ---- 調整可能な値(このページのスライダーで変更する) ---- */
    --gap:10;        /* 卓と卓の間隔(px) */
    --cellw:140;      /* 卓1つの幅(px)。高さは比率固定で自動計算 */
    --voffset:0;      /* カードの縦位置(px、フレーム内でのオフセット) */
    --fs-venue:30;    /* 店名の文字サイズ(px) */
    --fs-clock:24;    /* 時計の文字サイズ(px) */
    --fs-heading:17;  /* 「現在の卓状況」見出しの文字サイズ(px) */
    --fs-statnum:22;  /* 集計欄の数字の文字サイズ(px) */
    --fs-statlbl:8;   /* 集計欄のラベルの文字サイズ(px) */
    --fs-tno:12;      /* 卓名の文字サイズ(px) */
    --fs-state:17;    /* 卓の状態文字の文字サイズ(px) */
  }
  *{box-sizing:border-box;}
  body{background:#050506;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;margin:0;
    -webkit-tap-highlight-color:transparent;}
  h1,h2{margin:0;text-wrap:balance;}
  p{margin:0;}
  .page{max-width:520px;margin:0 auto;padding:28px 20px 56px;}

  .eyebrow{text-align:center;font-family:'Work Sans',sans-serif;font-size:11px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);margin-bottom:18px;}

  /* ---------- frame = 保存画像そのもの。ストーリーズと同じ9:16 ---------- */
  .frame-wrap{display:flex;justify-content:center;}
  #frame{width:360px;height:640px;background:var(--bg);position:relative;overflow:hidden;
    border-radius:8px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7);flex:none;}

  #card{width:320px;margin:calc(var(--voffset) * 1px) auto 0;
    background:var(--panel);border:1px solid var(--border);border-radius:20px;overflow:hidden;}
  .card-head{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
  .head-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .venue{font-family:'Bebas Neue',sans-serif;font-size:calc(var(--fs-venue) * 1px);letter-spacing:.03em;
    color:var(--text);white-space:nowrap;}
  .clock-block{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;}
  .clock-lbl{font-family:'Work Sans',sans-serif;font-size:8px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-dim);}
  .flip-clock{display:flex;align-items:center;gap:2px;}
  .flip-unit{position:relative;min-width:calc(var(--fs-clock) * .85px);background:#101014;color:var(--text);
    font-family:'Bebas Neue',sans-serif;font-size:calc(var(--fs-clock) * 1px);line-height:1;text-align:center;
    padding:6px 3px 5px;border-radius:4px;border:1px solid #050506;
    box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
    font-variant-numeric:tabular-nums;overflow:hidden;}
  .flip-unit::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;
    background:rgba(0,0,0,.6);transform:translateY(-.5px);}
  .flip-colon{font-family:'Bebas Neue',sans-serif;font-size:calc(var(--fs-clock) * .8px);color:var(--text-dim);padding:0 1px;}
  .subline{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:calc(var(--fs-heading) * 1px);
    letter-spacing:.02em;color:var(--gold);margin-top:9px;}
  .stats{display:flex;gap:8px;margin-top:12px;}
  .stat{position:relative;flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;
    padding:14px 5px 9px;text-align:center;}
  .stat .lbl{position:absolute;top:7px;left:8px;font-family:'Work Sans',sans-serif;font-size:calc(var(--fs-statlbl) * 1px);
    color:var(--text-dim);letter-spacing:.02em;}
  .stat .num{font-family:'Bebas Neue',sans-serif;font-size:calc(var(--fs-statnum) * 1px);line-height:1;
    font-variant-numeric:tabular-nums;margin-top:9px;}
  .stat.free .num{color:var(--gold);}
  .stat.rental .num{color:var(--red);}
  .stat.open .num{color:var(--green);}

  .grid{display:grid;grid-template-columns:repeat(2, calc(var(--cellw) * 1px));justify-content:center;
    gap:calc(var(--gap) * 1px);padding:18px;}
  .table-cell{position:relative;width:calc(var(--cellw) * 1px);height:calc(var(--cellw) * .8px);
    border-radius:14px;border:1.5px solid transparent;
    display:flex;align-items:center;justify-content:center;padding:9px;
    cursor:pointer;user-select:none;transition:transform .12s ease;}
  .table-cell:active{transform:scale(.96);}
  .table-cell .tno{position:absolute;top:8px;left:10px;font-family:'Bebas Neue',sans-serif;
    font-size:calc(var(--fs-tno) * 1px);letter-spacing:.02em;color:var(--text-dim);}
  .table-cell .state{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:calc(var(--fs-state) * 1px);}
  .table-cell.is-open{background:var(--green-soft);border-color:var(--green);}
  .table-cell.is-open .state{color:var(--green);}
  .table-cell.is-free,.table-cell.is-rental{background:var(--red-soft);border-color:var(--red);}
  .table-cell.is-free .state,.table-cell.is-rental .state{color:var(--red);}

  .legend{display:flex;justify-content:center;gap:14px;padding:0 18px 16px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;font-family:'Work Sans',sans-serif;font-size:10px;color:var(--text-dim);}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .legend .i-open{background:var(--green);} .legend .i-free{background:var(--red);}

  .hint{text-align:center;font-family:'Work Sans',sans-serif;font-size:11px;color:var(--text-dim);
    margin-top:16px;line-height:1.6;}

  /* ---------- controls (編集用。書き出し範囲の外) ---------- */
  .controls{margin-top:28px;padding-top:22px;border-top:1px solid var(--border);}
  .controls h2{font-family:'Work Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--gold);margin:20px 0 10px;}
  .controls h2:first-child{margin-top:0;}
  .control-row{display:flex;align-items:center;gap:12px;margin-top:8px;}
  .control-row label{font-family:'Work Sans',sans-serif;font-size:11.5px;color:var(--text-dim);flex:none;width:120px;}
  .control-row output{font-family:'Work Sans',sans-serif;font-size:11px;color:var(--text-dim);width:40px;text-align:right;
    font-variant-numeric:tabular-nums;flex:none;}
  input[type="range"]{flex:1;accent-color:var(--gold);}
  .save-btn{margin-top:16px;width:100%;padding:13px;border-radius:10px;border:1px solid var(--gold);
    background:var(--gold-soft);color:var(--gold);font-family:'Work Sans',sans-serif;font-size:13px;
    font-weight:700;letter-spacing:.02em;cursor:pointer;}
  .save-btn:hover{background:var(--gold);color:#171008;}
  .save-btn:disabled{opacity:.5;cursor:default;}
  .reset-btn{margin-top:10px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel);color:var(--text-dim);font-family:'Work Sans',sans-serif;font-size:12.5px;
    font-weight:600;cursor:pointer;}
  .reset-btn:hover{color:var(--text);border-color:var(--gold);}
  .save-status{margin-top:8px;min-height:14px;font-family:'Work Sans',sans-serif;font-size:10.5px;
    color:var(--text-dim);text-align:center;}
  .controls-note{margin-top:14px;font-family:'Work Sans',sans-serif;font-size:10.5px;color:var(--text-dim);
    text-align:center;line-height:1.6;}
  .values-box{margin-top:16px;padding:14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);
    font-family:'Work Sans',sans-serif;font-size:10.5px;color:var(--text-dim);line-height:1.8;word-break:break-all;}
  .values-box b{color:var(--text);}

  @media (prefers-reduced-motion:reduce){
    .table-cell{transition:none;}
  }
</style>
</head>
<body>

<div class="page">
  <p class="eyebrow">Size &amp; layout editor — PCで一度だけ調整してください</p>

  <div class="frame-wrap">
    <div id="frame">
      <div id="card">
        <div class="card-head">
          <div class="head-top">
            <h1 class="venue">麻雀ナイン</h1>
            <div class="clock-block">
              <p class="clock-lbl">Updated</p>
              <div class="flip-clock">
                <span class="flip-unit" id="flipH1">0</span>
                <span class="flip-unit" id="flipH2">0</span>
                <span class="flip-colon">:</span>
                <span class="flip-unit" id="flipM1">0</span>
                <span class="flip-unit" id="flipM2">0</span>
              </div>
            </div>
          </div>
          <p class="subline">【 現在の卓状況 】</p>
          <div class="stats">
            <div class="stat free"><p class="lbl">フリー稼働</p><p class="num" id="statFree">0</p></div>
            <div class="stat rental"><p class="lbl">貸卓使用中</p><p class="num" id="statRental">0</p></div>
            <div class="stat open"><p class="lbl">空卓</p><p class="num" id="statOpen">0</p></div>
          </div>
        </div>

        <div class="grid" id="grid"></div>

        <div class="legend">
          <span><i class="i-open"></i>空卓</span>
          <span><i class="i-free"></i>稼働中(フリー/貸卓はマス内の表記で区別)</span>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">枠(#frame)がそのまま保存画像になります。ストーリーズと同じ9:16の比率です。</p>

  <div class="controls">
    <h2>間隔・サイズ・位置</h2>
    <div class="control-row">
      <label for="rGap">卓の間隔</label>
      <input type="range" id="rGap" data-var="--gap" min="0" max="28" value="10">
      <output id="oGap">10</output>
    </div>
    <div class="control-row">
      <label for="rCellw">卓の大きさ</label>
      <input type="range" id="rCellw" data-var="--cellw" min="100" max="190" value="140">
      <output id="oCellw">140</output>
    </div>
    <div class="control-row">
      <label for="rVoffset">全体の縦位置</label>
      <input type="range" id="rVoffset" data-var="--voffset" min="-120" max="360" value="0">
      <output id="oVoffset">0</output>
    </div>

    <h2>文字サイズ</h2>
    <div class="control-row">
      <label for="rFsVenue">店名</label>
      <input type="range" id="rFsVenue" data-var="--fs-venue" min="20" max="44" value="30">
      <output id="oFsVenue">30</output>
    </div>
    <div class="control-row">
      <label for="rFsClock">時計</label>
      <input type="range" id="rFsClock" data-var="--fs-clock" min="16" max="38" value="24">
      <output id="oFsClock">24</output>
    </div>
    <div class="control-row">
      <label for="rFsHeading">見出し</label>
      <input type="range" id="rFsHeading" data-var="--fs-heading" min="12" max="28" value="17">
      <output id="oFsHeading">17</output>
    </div>
    <div class="control-row">
      <label for="rFsStatnum">集計数字</label>
      <input type="range" id="rFsStatnum" data-var="--fs-statnum" min="16" max="34" value="22">
      <output id="oFsStatnum">22</output>
    </div>
    <div class="control-row">
      <label for="rFsStatlbl">集計ラベル</label>
      <input type="range" id="rFsStatlbl" data-var="--fs-statlbl" min="6" max="15" value="8">
      <output id="oFsStatlbl">8</output>
    </div>
    <div class="control-row">
      <label for="rFsTno">卓名</label>
      <input type="range" id="rFsTno" data-var="--fs-tno" min="9" max="20" value="12">
      <output id="oFsTno">12</output>
    </div>
    <div class="control-row">
      <label for="rFsState">状態文字</label>
      <input type="range" id="rFsState" data-var="--fs-state" min="13" max="28" value="17">
      <output id="oFsState">17</output>
    </div>

    <button class="save-btn" id="saveBtn">この見た目で画像を書き出す</button>
    <p class="save-status" id="saveStatus"></p>
    <button class="reset-btn" id="resetBtn">全卓を空卓にリセット</button>

    <div class="values-box" id="valuesBox"></div>
    <p class="controls-note">調整が終わったら、上の数値ボックスの内容をそのままAIに伝えてください。日常用ページ(スライダーなし版)の初期値としてそのまま反映します。</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  var LABELS = {open:'空卓', free:'フリー', rental:'貸卓使用中'};
  // 卓ごとの名称・許容する状態(フリー専用卓は貸卓に切り替わらない)・初期状態
  var TABLES = [
    {name:'フリー卓', states:['open','free'],          initial:'free'},
    {name:'自動配牌', states:['open','free','rental'], initial:'open'},
    {name:'通常卓',   states:['open','free','rental'], initial:'free'},
    {name:'通常卓',   states:['open','free','rental'], initial:'rental'},
    {name:'通常卓',   states:['open','free','rental'], initial:'open'},
    {name:'通常卓',   states:['open','free','rental'], initial:'open'}
  ];

  var grid = document.getElementById('grid');
  var cells = [];

  TABLES.forEach(function(t, i){
    var cell = document.createElement('div');
    cell.className = 'table-cell';
    cell.dataset.state = t.initial;
    cell.dataset.states = t.states.join(',');
    cell.innerHTML = '<span class="tno">' + t.name + '</span><span class="state"></span>';
    cell.addEventListener('click', (function(idx){
      return function(){
        var c = cells[idx];
        var states = c.dataset.states.split(',');
        var next = states[(states.indexOf(c.dataset.state) + 1) % states.length];
        c.dataset.state = next;
        render();
      };
    })(i));
    grid.appendChild(cell);
    cells.push(cell);
  });

  function render(){
    var free = 0, rental = 0, open = 0;
    cells.forEach(function(c){
      var s = c.dataset.state;
      c.classList.remove('is-open','is-free','is-rental');
      c.classList.add('is-' + s);
      c.querySelector('.state').textContent = LABELS[s];
      if (s === 'open') open++;
      if (s === 'free') free++;
      if (s === 'rental') rental++;
    });
    document.getElementById('statFree').textContent = free;
    document.getElementById('statRental').textContent = rental;
    document.getElementById('statOpen').textContent = open;
  }

  function tick(){
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    document.getElementById('flipH1').textContent = hh[0];
    document.getElementById('flipH2').textContent = hh[1];
    document.getElementById('flipM1').textContent = mm[0];
    document.getElementById('flipM2').textContent = mm[1];
  }

  document.getElementById('resetBtn').addEventListener('click', function(){
    cells.forEach(function(c){ c.dataset.state = 'open'; });
    render();
  });

  // ---- スライダー ↔ CSS変数 ----
  var root = document.documentElement;
  var sliders = Array.prototype.slice.call(document.querySelectorAll('input[type="range"][data-var]'));

  function updateValuesBox(){
    var lines = sliders.map(function(s){
      return s.dataset.var + ': ' + s.value;
    });
    document.getElementById('valuesBox').innerHTML = '<b>現在の設定値</b><br>' + lines.join('<br>');
  }

  sliders.forEach(function(s){
    var out = document.getElementById('o' + s.id.slice(1));
    s.addEventListener('input', function(){
      root.style.setProperty(s.dataset.var, s.value);
      if (out) out.textContent = s.value;
      updateValuesBox();
    });
  });
  updateValuesBox();

  // ---- 画像として保存(フレーム全体=9:16。写真アプリへの保存を優先) ----
  var saveBtn = document.getElementById('saveBtn');
  var saveStatus = document.getElementById('saveStatus');

  saveBtn.addEventListener('click', function(){
    if (typeof html2canvas !== 'function') {
      saveStatus.textContent = '保存機能の読み込みに失敗しました。スクリーンショットをご利用ください。';
      return;
    }
    saveBtn.disabled = true;
    saveStatus.textContent = '画像を作成中...';
    var frame = document.getElementById('frame');
    var scale = 1080 / frame.offsetWidth;
    html2canvas(frame, {backgroundColor: null, scale: scale}).then(function(canvas){
      return new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
    }).then(function(blob){
      var d = new Date();
      var hh = String(d.getHours()).padStart(2, '0');
      var mm = String(d.getMinutes()).padStart(2, '0');
      var filename = '麻雀ナイン_卓状況_' + hh + mm + '.png';
      var file = new File([blob], filename, {type: 'image/png'});
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      // iOSはダウンロードだとファイルアプリ行きになるため共有シート経由にする。
      // それ以外(PC・Android等)は共有シートに「保存」相当の項目がないことがあるため、通常のダウンロードにする。
      if (isIOS && navigator.canShare && navigator.canShare({files: [file]})) {
        return navigator.share({files: [file]}).then(function(){
          saveStatus.textContent = '共有シートから「写真に保存」を選んでください';
        });
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      saveStatus.textContent = '保存しました';
    }).catch(function(err){
      if (err && err.name === 'AbortError') { saveStatus.textContent = ''; return; }
      saveStatus.textContent = '保存できませんでした。スクリーンショットをご利用ください。';
    }).finally(function(){
      saveBtn.disabled = false;
    });
  });

  render();
  tick();
  setInterval(tick, 30000);
})();
</script>

</body>
</html>
